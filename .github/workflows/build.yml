name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - ".gitmodules"
      - "apps.json"
      - "frappe-version.txt"
      - "frappe_docker"
      - "frappe_docker/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".gitmodules"
      - "apps.json"
      - "frappe-version.txt"
      - "frappe_docker"
      - "frappe_docker/**"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # Resolve which apps to install: prefer the workflow-dispatch input,
      # fall back to the committed apps.json file.
      - name: Prepare apps JSON
        run: |
          echo "FRAPPE_VERSION=$(cat frappe-version.txt)" >> $GITHUB_ENV
          echo "APPS_METADATA=$(jq -r '[ .[] | "\((.url | sub("\\.git$"; "") | split("/") | .[-2:] | join("/")) )@\(.version)" ] | join(",")' apps.json)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            frappe.version=${{ env.FRAPPE_VERSION }}
            frappe.apps=${{ env.APPS_METADATA }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.FRAPPE_VERSION }}
            type=semver,pattern={{major}}.{{minor}}, value=${{ env.FRAPPE_VERSION }}
            type=semver,pattern={{major}}, value=${{ env.FRAPPE_VERSION }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          file: frappe_docker/images/layered/Containerfile
          context: frappe_docker
          push: false
          load: true
          tags: erpnext-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_VERSION  }}
          secret-files: |
            apps_json=apps.json
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          script_path="${RUNNER_TEMP}/erpnext-smoke-test.sh"
          cat > "${script_path}" <<'EOF'
          set -euo pipefail
          echo "=== starting smoke test ==="
          whoami
          pwd
          echo "=== /home/frappe ==="
          ls -la /home/frappe
          cd /home/frappe/frappe-bench
          echo "=== working directory ==="
          pwd
          echo "=== apps directory ==="
          ls -la apps
          echo "Expected apps metadata: ${APPS_METADATA}"
          echo "=== bench --version output ==="
          bench --version 2>&1 | cat
          echo "=== bench version output ==="
          bench version 2>&1 | tee /tmp/bench-version.txt
          IFS=, read -r -a entries <<< "${APPS_METADATA}"
          for entry in "${entries[@]}"; do
            repo="${entry%@*}"
            expected="${entry##*@}"
            app="${repo##*/}"
            app_path="apps/${app}"
            test -d "${app_path}" || { echo "Missing app directory: ${app_path}"; exit 1; }

            actual="$(awk -v app="${app}" '$1 == app { print $2; exit }' /tmp/bench-version.txt)"
            [ -n "${actual}" ] || { echo "Missing app version in bench output: ${app}"; exit 1; }
            echo "Validated ${app}: apps.json=${expected}, bench=${actual}"
          done
          echo "=== smoke test passed ==="
          EOF
          chmod +x "${script_path}"
          echo "::group::Running smoke test container"
          docker run --rm \
            --entrypoint bash \
            -e APPS_METADATA="${APPS_METADATA}" \
            -v "${script_path}:/tmp/erpnext-smoke-test.sh:ro" \
            erpnext-smoke:${{ github.sha }} \
            /tmp/erpnext-smoke-test.sh
          echo "::endgroup::"

      - name: Build and push image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          file: frappe_docker/images/layered/Containerfile
          context: frappe_docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_VERSION  }}
          secret-files: |
            apps_json=apps.json
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
