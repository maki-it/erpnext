name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - ".gitmodules"
      - "apps.json"
      - "frappe-version.txt"
      - "frappe_docker"
      - "frappe_docker/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".gitmodules"
      - "apps.json"
      - "frappe-version.txt"
      - "frappe_docker"
      - "frappe_docker/**"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # Resolve which apps to install: prefer the workflow-dispatch input,
      # fall back to the committed apps.json file.
      - name: Prepare apps JSON
        run: |
          echo "FRAPPE_VERSION=$(cat frappe-version.txt)" >> $GITHUB_ENV
          echo "APPS_METADATA=$(jq -r '[ .[] | "\((.url | sub("\\.git$"; "") | split("/") | .[-2:] | join("/")) )@\(.version)" ] | join(",")' apps.json)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            frappe.version=${{ env.FRAPPE_VERSION }}
            frappe.apps=${{ env.APPS_METADATA }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.FRAPPE_VERSION }}
            type=semver,pattern={{major}}.{{minor}}, value=${{ env.FRAPPE_VERSION }}
            type=semver,pattern={{major}}, value=${{ env.FRAPPE_VERSION }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          file: frappe_docker/images/layered/Containerfile
          context: frappe_docker
          push: false
          load: true
          tags: erpnext-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_VERSION  }}
          secret-files: |
            apps_json=apps.json
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run --rm -e APPS_METADATA="${APPS_METADATA}" erpnext-smoke:${{ github.sha }} bash -lc '
            set -euo pipefail
            cd /home/frappe/frappe-bench
            bench --version
            echo "Expected apps metadata: ${APPS_METADATA}"
            bench version
            IFS=, read -r -a entries <<< "${APPS_METADATA}"
            for entry in "${entries[@]}"; do
              repo="${entry%@*}"
              expected="${entry##*@}"
              app="${repo##*/}"
              app_path="apps/${app}"
              test -d "${app_path}" || { echo "Missing app directory: ${app_path}"; exit 1; }

              init_file="${app_path}/${app}/__init__.py"
              actual=""
              if [ -f "${init_file}" ]; then
                actual="$(python -c "import pathlib,re,sys; t=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore'); m=re.search(r\"__version__\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]\", t); print(m.group(1) if m else '')" "${init_file}")"
              fi
              if [ -z "${actual}" ] && [ -f "${app_path}/pyproject.toml" ]; then
                actual="$(python -c "import pathlib,re,sys; t=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore'); m=re.search(r\"^version\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]\", t, re.M); print(m.group(1) if m else '')" "${app_path}/pyproject.toml")"
              fi

              expected_no_v="${expected#v}"
              if [ -n "${actual}" ] && [ "${actual}" != "${expected}" ] && [ "${actual}" != "${expected_no_v}" ]; then
                echo "Version mismatch for ${app}: expected ${expected}, got ${actual}"
                exit 1
              fi
              echo "Validated ${app}: expected ${expected}${actual:+, detected ${actual}}"
            done
          '

      - name: Build and push image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          file: frappe_docker/images/layered/Containerfile
          context: frappe_docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_VERSION  }}
          secret-files: |
            apps_json=apps.json
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
